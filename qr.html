<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personel Sistemi</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body class="login-body"><div class="orb o1"></div><div class="orb o2"></div><main class="login-card"><div class="brand"><div class="logo">◆</div><div><h1>Personel Sistemi</h1><p>Premium yönetim paneli</p></div></div>{% if error %}<div class="alert">{{ error }}</div>{% endif %}<form method="post"><label>Kullanıcı adı</label><input name="username" value="eren" autocomplete="username"><label>Şifre</label><input name="password" type="password" value="1234" autocomplete="current-password"><button>Panele Giriş Yap</button></form><div class="hint">Kullanıcı adı: <b>eren</b> • Şifre: <b>1234</b></div></main>
<!-- phone-status-sync-fix -->
<script>
(function () {
  const FIX_VERSION = 'qr-status-sync-v2';
  function bust(url) {
    const u = new URL(url, window.location.origin);
    u.searchParams.set('_sync', FIX_VERSION);
    u.searchParams.set('_t', Date.now().toString());
    return u.pathname + '?' + u.searchParams.toString();
  }
  async function refreshPuantaj() {
    document.querySelectorAll('[data-puantaj-url], a[href*="puantaj"], a[href*="attendance"], a[href*="status"]').forEach(el => {
      if (el.dataset && el.dataset.puantajUrl) el.dataset.puantajUrl = bust(el.dataset.puantajUrl);
    });
    try {
      const res = await fetch(bust('/api/personel/puantaj'), {cache:'no-store', credentials:'same-origin'});
      if (!res.ok) return;
      const data = await res.json();
      window.dispatchEvent(new CustomEvent('puantaj:updated', {detail:data}));
    } catch(e) {}
  }
  window.addEventListener('focus', refreshPuantaj);
  window.addEventListener('pageshow', refreshPuantaj);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshPuantaj(); });
  setInterval(() => { if (!document.hidden) refreshPuantaj(); }, 60000);
})();
</script>

<script src="salary_puantaj_live_sync.js?v=3"></script></body></html>
