plugins {
    id 'com.android.application'
}

android {
    namespace 'com.boztek.qroneshot'
    compileSdk 35

    defaultConfig {
        applicationId 'com.boztek.qroneshot'
        minSdk 23
        targetSdk 35
        versionCode 5
        versionName '5.0'
    }
}

dependencies {
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.zxing:core:3.5.3'
}
