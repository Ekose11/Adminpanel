<link rel="stylesheet" href="../boztek_premium_readability.css?v=final3">{% extends "base.html" %}{% block content %}<section class="hero"><div><div class="eyebrow">İzin</div><h1>İzinler</h1><p>İzin günleri puantajda gelmedi olarak kesilmez.</p></div></section><div class="card"><form method="post" class="form-grid"><div class="field"><label>Personel</label><select name="person_id">{% for p in people %}<option value="{{p.id}}">{{p.full_name}} - Kalan {{p.annual_leave_remaining}}</option>{% endfor %}</select></div><div class="field"><label>Başlangıç</label><input name="start_date" type="date" required></div><div class="field"><label>Bitiş</label><input name="end_date" type="date" required></div><button class="btn">İzin Ekle</button></form></div><div class="card"><table class="table"><tr><th>Personel</th><th>Tarih</th><th>Gün</th><th>Durum</th></tr>{% for r in rows %}<tr><td>{{r.full_name}}</td><td>{{r.start_date}} - {{r.end_date}}</td><td>{{r.days_count}}</td><td>{{r.status}}</td></tr>{% endfor %}</table></div>{% endblock %}

<!-- phone-status-sync-fix -->
<script>
(function () {
  const FIX_VERSION = 'qr-status-sync-v2';
  function bust(url) {
    const u = new URL(url, window.location.origin);
    u.searchParams.set('_sync', FIX_VERSION);
    u.searchParams.set('_t', Date.now().toString());
    return u.pathname + '?' + u.searchParams.toString();
  }
  async function refreshPuantaj() {
    document.querySelectorAll('[data-puantaj-url], a[href*="puantaj"], a[href*="attendance"], a[href*="status"]').forEach(el => {
      if (el.dataset && el.dataset.puantajUrl) el.dataset.puantajUrl = bust(el.dataset.puantajUrl);
    });
    try {
      const res = await fetch(bust('/api/personel/puantaj'), {cache:'no-store', credentials:'same-origin'});
      if (!res.ok) return;
      const data = await res.json();
      window.dispatchEvent(new CustomEvent('puantaj:updated', {detail:data}));
    } catch(e) {}
  }
  window.addEventListener('focus', refreshPuantaj);
  window.addEventListener('pageshow', refreshPuantaj);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshPuantaj(); });
  setInterval(() => { if (!document.hidden) refreshPuantaj(); }, 60000);
})();
</script>
